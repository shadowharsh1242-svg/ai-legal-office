<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel • AI Legal Office</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f6fb;color:#172033}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:white;border:1px solid #dbe2ea;border-radius:16px;padding:20px;box-shadow:0 8px 30px #0000000b}.login{max-width:420px;margin:10vh auto}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;background:#172033;color:white;font-weight:700}.btn.alt{background:#e9eef5;color:#172033}.btn.danger{background:#b91c1c}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:16px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{border:1px solid #cbd5e1;background:white;border-radius:9px;padding:9px 12px;cursor:pointer}.tab.active{background:#172033;color:white}.tablewrap{overflow:auto;margin-top:14px}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:11px;border-bottom:1px solid #e5e7eb}th{background:#f8fafc}.hidden{display:none}.muted{color:#64748b}.check{display:flex;align-items:center;gap:8px;margin:10px 0}.check input{width:18px;height:18px}.notice{padding:12px;border-radius:10px;background:#fff7ed;border:1px solid #fed7aa;margin:14px 0}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}
</style></head><body>
<div id="login" class="wrap"><div class="card login"><h1>⚙ Admin पैनल</h1><p class="muted">AI Legal Office — full control</p><div class="notice">Demo credentials: username <b>harsh</b>, password <b>harsh</b>. वास्तविक client data जोड़ने से पहले secure server-side authentication लगाना जरूरी है.</div><div class="field"><label>Login ID</label><input id="user" autocomplete="username"></div><div class="field"><label>Password</label><input id="pass" type="password" autocomplete="current-password"></div><button class="btn" onclick="login()">Login</button><p id="err" style="color:#b91c1c"></p></div></div>
<div id="app" class="wrap hidden"><div class="top"><div><h1 style="margin:0">Admin कंट्रोल सेंटर</h1><div class="muted">Cases, clients, diary, tasks, documents और site settings</div></div><div class="row"><a class="btn alt" href="index.html">← Case Diary</a><button class="btn" onclick="logout()">Logout</button></div></div>
<div class="grid" id="stats"></div>
<div class="tabs"><button class="tab active" onclick="tab('cases',this)">Cases</button><button class="tab" onclick="tab('clients',this)">Clients</button><button class="tab" onclick="tab('hearings',this)">Hearings</button><button class="tab" onclick="tab('tasks',this)">Tasks</button><button class="tab" onclick="tab('docs',this)">Documents</button><button class="tab" onclick="tab('settings',this)">Settings</button><button class="tab" onclick="tab('data',this)">Data</button></div>
<section id="cases" class="card panel"></section><section id="clients" class="card panel hidden"></section><section id="hearings" class="card panel hidden"></section><section id="tasks" class="card panel hidden"></section><section id="docs" class="card panel hidden"></section><section id="settings" class="card panel hidden"></section><section id="data" class="card panel hidden"></section>
</div>
<script>
const KEY='legalOfficeState';
const demo={cases:[],clients:[],hearings:[],tasks:[],docs:[]};
function getState(){try{return JSON.parse(localStorage.getItem(KEY))||demo}catch(e){return demo}}
function setState(s){localStorage.setItem(KEY,JSON.stringify(s))}
function login(){if(document.getElementById('user').value==='harsh'&&document.getElementById('pass').value==='harsh'){sessionStorage.admin='1';show()}else document.getElementById('err').textContent='Login details गलत हैं.'}
function logout(){sessionStorage.removeItem('admin');location.reload()}
function show(){if(sessionStorage.admin==='1'){loginEl.classList.add('hidden');app.classList.remove('hidden');renderAll()}}
const loginEl=document.getElementById('login'),app=document.getElementById('app');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderAll(){const s=getState();document.getElementById('stats').innerHTML=[['Cases',s.cases.length],['Clients',s.clients.length],['Hearings',s.hearings.length],['Tasks',s.tasks.length]].map(x=>'<div class="stat"><b>'+x[0]+'</b><div style="font-size:28px;margin-top:5px">'+x[1]+'</div></div>').join('');renderCases();renderClients();renderHearings();renderTasks();renderDocs();renderSettings();renderData()}
function renderCases(){const s=getState();document.getElementById('cases').innerHTML='<h2>Cases — Full Control</h2><p class="muted">Case हटाने पर उससे जुड़े hearings, tasks और documents भी हटेंगे.</p><div class="tablewrap"><table><tr><th>Case</th><th>Client</th><th>Court</th><th>Next Date</th><th>Status</th><th></th></tr>'+s.cases.map(c=>'<tr><td>'+esc(c.no)+'</td><td>'+esc(c.client)+'</td><td>'+esc(c.court)+'</td><td>'+esc(c.date)+'</td><td>'+esc(c.status)+'</td><td><button class="btn danger" onclick="removeCase(\''+esc(c.id)+'\')">Delete</button></td></tr>').join('')+'</table></div>'}
function renderClients(){const s=getState();document.getElementById('clients').innerHTML='<h2>Clients</h2><div class="tablewrap"><table><tr><th>Name</th><th>Phone</th><th>Language</th><th></th></tr>'+s.clients.map((c,i)=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(c.phone)+'</td><td>'+esc(c.lang)+'</td><td><button class="btn danger" onclick="removeClient('+i+')">Delete</button></td></tr>').join('')+'</table></div>'}
function renderHearings(){const s=getState();document.getElementById('hearings').innerHTML='<h2>Hearings</h2><div class="tablewrap"><table><tr><th>Date</th><th>Case</th><th>Status</th><th>Result</th><th></th></tr>'+s.hearings.map((h,i)=>'<tr><td>'+esc(h.date)+'</td><td>'+esc(h.caseId)+'</td><td>'+esc(h.status)+'</td><td>'+esc(h.result)+'</td><td><button class="btn danger" onclick="removeItem(\'hearings\','+i+')">Delete</button></td></tr>').join('')+'</table></div>'}
function renderTasks(){const s=getState();document.getElementById('tasks').innerHTML='<h2>Tasks</h2><div class="tablewrap"><table><tr><th>Task</th><th>Case</th><th>Due</th><th>Status</th><th></th></tr>'+s.tasks.map((t,i)=>'<tr><td>'+esc(t.task)+'</td><td>'+esc(t.caseId)+'</td><td>'+esc(t.due)+'</td><td>'+esc(t.status)+'</td><td><button class="btn danger" onclick="removeItem(\'tasks\','+i+')">Delete</button></td></tr>').join('')+'</table></div>'}
function renderDocs(){const s=getState();document.getElementById('docs').innerHTML='<h2>Documents</h2><div class="tablewrap"><table><tr><th>Case</th><th>Document</th><th>Due</th><th>Status</th><th></th></tr>'+s.docs.map((d,i)=>'<tr><td>'+esc(d.caseId)+'</td><td>'+esc(d.name)+'</td><td>'+esc(d.due)+'</td><td>'+esc(d.status)+'</td><td><button class="btn danger" onclick="removeItem(\'docs\','+i+')">Delete</button></td></tr>').join('')+'</table></div>'}
function renderSettings(){const s=getState();const cfg=JSON.parse(localStorage.getItem('legalOfficeSettings')||'{"language":"Hindi","showCases":true,"showHearings":true,"showTasks":true,"showClients":true}');document.getElementById('settings').innerHTML='<h2>Website Settings</h2><div class="field"><label>Language</label><select id="lang"><option '+(cfg.language==='Hindi'?'selected':'')+'>Hindi</option><option '+(cfg.language==='English'?'selected':'')+'>English</option></select></div>'+['Cases','Hearings','Tasks','Clients'].map(x=>'<label class="check"><input type="checkbox" id="show'+x+'" '+(cfg['show'+x]?'checked':'')+'> '+x+' section दिखाएँ</label>').join('')+'<button class="btn" onclick="saveSettings()">Save Settings</button>'}
function renderData(){document.getElementById('data').innerHTML='<h2>Data Management</h2><div class="row"><button class="btn" onclick="exportData()">Export JSON</button><button class="btn danger" onclick="resetData()">Reset all demo data</button></div><p class="muted">These controls currently use browser local storage; live Google Sheets sync is not connected yet.</p>'}
function removeCase(id){if(!confirm('पूरा case और उससे जुड़े records delete करें?'))return;const s=getState();const c=s.cases.find(x=>x.id===id);s.cases=s.cases.filter(x=>x.id!==id);s.hearings=s.hearings.filter(x=>x.caseId!==id);s.tasks=s.tasks.filter(x=>x.caseId!==id);s.docs=s.docs.filter(x=>x.caseId!==id);if(c)s.clients=s.clients.filter(x=>x.name!==c.client);setState(s);renderAll()}
function removeClient(i){if(!confirm('Clients delete करें?'))return;const s=getState();s.clients.splice(i,1);setState(s);renderAll()}
function removeItem(k,i){if(!confirm('Delete this record?'))return;const s=getState();s[k].splice(i,1);setState(s);renderAll()}
function saveSettings(){const cfg={language:document.getElementById('lang').value,showCases:showCases.checked,showHearings:showHearings.checked,showTasks:showTasks.checked,showClients:showClients.checked};localStorage.setItem('legalOfficeSettings',JSON.stringify(cfg));alert('Settings saved.')}
function exportData(){const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(getState(),null,2));a.download='legal-office-backup.json';a.click()}
function resetData(){if(!confirm('Delete all demo data?'))return;localStorage.removeItem(KEY);location.reload()}
function tab(id,btn){document.querySelectorAll('.panel').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
show();
</script></body></html>
