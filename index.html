<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Case Diary</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fa;color:#172033}
header{background:#172033;color:#fff;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}
h1{margin:0;font-size:24px}.wrap{max-width:1250px;margin:0 auto;padding:20px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid #dfe4ea;border-radius:12px;padding:12px;margin-bottom:16px}
button,input{font:inherit}button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;background:#172033;color:#fff}
button.secondary{background:#eef1f5;color:#172033;border:1px solid #d7dde5}button.danger{background:#b42318}
input[type=date],input[type=text]{border:1px solid #cbd3dd;border-radius:8px;padding:10px;background:#fff}
.datebox{display:flex;align-items:center;gap:8px}.selected{font-weight:700;min-width:160px}
.card{background:#fff;border:1px solid #dfe4ea;border-radius:12px;overflow:hidden}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}
th,td{padding:13px 12px;border-bottom:1px solid #e8ebef;text-align:left;vertical-align:middle}
th{background:#f1f4f7;font-size:13px;text-transform:uppercase;letter-spacing:.03em}
tr:last-child td{border-bottom:0}.empty{text-align:center;padding:42px;color:#687386}
.actions{display:flex;gap:6px}.small{padding:7px 10px;font-size:13px}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.42);align-items:center;justify-content:center;padding:18px}
.modal-card{background:#fff;width:min(620px,100%);border-radius:14px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-card h2{margin:0 0 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.note{font-size:13px;color:#687386;margin:10px 0 0}
@media(max-width:700px){header{padding:15px}.wrap{padding:12px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.selected{min-width:auto}}
</style>
</head>
<body>
<header><h1>Case Diary</h1><button id="addTop">Add New Case</button></header>
<main class="wrap">
<div class="toolbar">
<button class="secondary" id="prev">Previous Day</button>
<button class="secondary" id="today">Today</button>
<button class="secondary" id="next">Next Day</button>
<div class="datebox"><input id="datePicker" type="date"><span id="dateLabel" class="selected"></span></div>
</div>
<div class="card">
<div class="table-wrap">
<table>
<thead><tr><th>Previous Date</th><th>Case No.</th><th>Court</th><th>Party Name</th><th>Position / Stage</th><th>Next Date</th><th>Action</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
</div>
<p class="note">This is the simple working diary. Cases are saved on this device.</p>
</main>

<div id="modal">
<div class="modal-card">
<h2>Add New Case</h2>
<form id="caseForm">
<div class="grid">
<div class="field"><label>Previous Date</label><input id="previousDate" type="date"></div>
<div class="field"><label>Next Date</label><input id="nextDate" type="date"></div>
<div class="field"><label>Case No.</label><input id="caseNo" type="text" required></div>
<div class="field"><label>Court</label><input id="court" type="text" required></div>
<div class="field"><label>Party Name</label><input id="party" type="text" required></div>
<div class="field"><label>Position / Stage</label><input id="stage" type="text" required></div>
</div>
<div class="modal-actions"><button type="button" class="secondary" id="cancel">Cancel</button><button type="submit">Save Case</button></div>
</form>
</div>
</div>

<script>
const KEY="case_diary_cases_v1";
let cases=JSON.parse(localStorage.getItem(KEY)||"[]");
let selected=new Date();
selected.setHours(0,0,0,0);

const $=id=>document.getElementById(id);
const iso=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return y+"-"+m+"-"+day};
const save=()=>localStorage.setItem(KEY,JSON.stringify(cases));
const format=d=>new Intl.DateTimeFormat("en-IN",{day:"2-digit",month:"short",year:"numeric"}).format(d);

function render(){
 const key=iso(selected);
 $("datePicker").value=key;
 $("dateLabel").textContent=format(selected);
 const rows=$("rows");
 const list=cases.filter(c=>c.previousDate===key || c.nextDate===key);
 rows.innerHTML="";
 if(!list.length){
   rows.innerHTML='<tr><td colspan="7" class="empty">No cases for this date.</td></tr>';
   return;
 }
 list.forEach(c=>{
   const tr=document.createElement("tr");
   tr.innerHTML=
     "<td>"+(c.previousDate?format(new Date(c.previousDate+"T00:00:00")):"—")+"</td>"+
     "<td><strong>"+esc(c.caseNo)+"</strong></td>"+
     "<td>"+esc(c.court)+"</td>"+
     "<td>"+esc(c.party)+"</td>"+
     "<td>"+esc(c.stage)+"</td>"+
     "<td>"+(c.nextDate?format(new Date(c.nextDate+"T00:00:00")):"—")+"</td>"+
     '<td><div class="actions"><button class="danger small" data-id="'+c.id+'">Remove</button></div></td>';
   rows.appendChild(tr);
 });
 rows.querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>removeCase(b.dataset.id));
}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function openModal(){ $("caseForm").reset(); $("previousDate").value=iso(selected); $("modal").style.display="flex"; $("caseNo").focus(); }
function closeModal(){ $("modal").style.display="none"; }
function removeCase(id){
 const c=cases.find(x=>x.id===id);
 if(!c)return;
 if(confirm("Remove case "+c.caseNo+" from the diary?")){
   cases=cases.filter(x=>x.id!==id); save(); render();
 }
}
$("addTop").onclick=openModal;
$("cancel").onclick=closeModal;
$("modal").onclick=e=>{if(e.target===$("modal"))closeModal()};
$("prev").onclick=()=>{selected.setDate(selected.getDate()-1);render()};
$("next").onclick=()=>{selected.setDate(selected.getDate()+1);render()};
$("today").onclick=()=>{selected=new Date();selected.setHours(0,0,0,0);render()};
$("datePicker").onchange=e=>{selected=new Date(e.target.value+"T00:00:00");render()};
$("caseForm").onsubmit=e=>{
 e.preventDefault();
 cases.push({
   id:Date.now().toString(36)+Math.random().toString(36).slice(2),
   previousDate:$("previousDate").value,
   caseNo:$("caseNo").value.trim(),
   court:$("court").value.trim(),
   party:$("party").value.trim(),
   stage:$("stage").value.trim(),
   nextDate:$("nextDate").value
 });
 save(); closeModal(); render();
};
render();
</script>
</body>
</html>
