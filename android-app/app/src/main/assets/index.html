<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f7f7f5"><title>AI Legal Office</title><style>:root{--bg:#f7f7f5;--card:#fff;--text:#18202a;--muted:#6d7682;--line:#e7e9ec;--accent:#244a73;--accent2:#eaf1f8;--warn:#fff3dc;--danger:#fff0ef;--ok:#e9f7ef;--shadow:0 2px 12px #17203310}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);-webkit-tap-highlight-color:transparent}button,input,select{font:inherit}button{border:0}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:86px}.top{padding:22px 18px 12px;position:sticky;top:0;background:#f7f7f5f2;backdrop-filter:blur(12px);z-index:5}.brand{font-size:14px;font-weight:800;letter-spacing:.08em;color:var(--accent)}h1{font-size:28px;margin:4px 0 2px}.sub{color:var(--muted);font-size:14px}.page{padding:10px 16px}.hero{background:var(--accent);color:#fff;border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}.hero strong{font-size:20px}.hero p{margin:6px 0 0;opacity:.88}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.metric{min-height:104px}.metric .num{font-size:30px;font-weight:800;margin:8px 0 2px}.metric .lbl{font-size:13px;color:var(--muted)}.section{font-size:17px;font-weight:800;margin:22px 2px 10px}.row{display:flex;align-items:center;gap:12px}.list{display:flex;flex-direction:column;gap:9px}.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.item .title{font-weight:750}.item .meta{font-size:13px;color:var(--muted);margin-top:4px}.item .actions{display:flex;gap:8px;margin-top:11px}.btn{padding:11px 14px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;min-height:44px}.btn.light{background:var(--accent2);color:var(--accent)}.btn.ghost{background:#f3f4f6;color:var(--text)}.btn.full{width:100%}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick .btn{min-height:58px;text-align:left}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10}.nav{max-width:760px;width:100%;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 6px env(safe-area-inset-bottom)}.nav button{background:none;color:var(--muted);padding:8px 2px;font-size:11px;font-weight:700}.nav button.active{color:var(--accent)}.nav span{display:block;font-size:20px;margin-bottom:2px}.search{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:14px;background:#fff;outline:0}.search:focus{border-color:var(--accent)}.form{display:flex;flex-direction:column;gap:10px}.form label{font-size:13px;font-weight:700;color:var(--muted)}.form input,.form select,.form textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff}.form textarea{min-height:100px;resize:vertical}.back{background:none;color:var(--accent);font-weight:800;padding:4px 0;margin-bottom:8px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;background:#eef0f3}.pill.warn{background:var(--warn)}.pill.danger{background:var(--danger)}.pill.ok{background:var(--ok)}.empty{padding:28px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:16px}@media(min-width:700px){.app{padding-left:10px;padding-right:10px}.grid{grid-template-columns:repeat(4,1fr)}.quick{grid-template-columns:repeat(3,1fr)}}</style></head><body><div class="app"><header class="top"><div class="brand">AI LEGAL OFFICE</div><h1 id="heading">Good morning</h1><div class="sub" id="today"></div></header><main id="app" class="page"></main></div><div class="bottom"><nav class="nav"><button data-nav="home"><span>⌂</span>Today</button><button data-nav="cases"><span>▣</span>Cases</button><button data-nav="hearings"><span>◷</span>Hearings</button><button data-nav="tasks"><span>✓</span>Tasks</button><button data-nav="clients"><span>♙</span>Clients</button></nav></div><script>const cases=[{id:'C-001',client:'Rajesh Sharma',party:'Rajesh Sharma vs. State',caseNo:'123/2026',court:'District Court',stage:'Evidence',previous:'2026-08-28',next:'2026-09-17',time:'10:30 AM',purpose:'Evidence',docs:1},{id:'C-002',client:'Priya Verma',party:'Priya Verma vs. State',caseNo:'88/2025',court:'High Court',stage:'Bail Hearing',previous:'2026-09-02',next:'2026-09-18',time:'11:15 AM',purpose:'Hearing',docs:0},{id:'C-003',client:'Amit Singh',party:'Amit Singh vs. Sunita Singh',caseNo:'45/2024',court:'Family Court',stage:'Arguments',previous:'2026-08-19',next:'2026-09-22',time:'12:00 PM',purpose:'Arguments',docs:2},{id:'C-004',client:'Neha Gupta',party:'Neha Gupta vs. Rakesh Gupta',caseNo:'77/2023',court:'District Court',stage:'Closed',previous:'2026-07-11',next:'',time:'',purpose:'',docs:0}];let tasks=[{id:1,title:'Confirm Rajesh hearing result',meta:'Post-hearing update',priority:'High',done:false},{id:2,title:'Collect address proof from Amit',meta:'Client document',priority:'Normal',done:false},{id:3,title:'Review Priya file before tomorrow',meta:'Case preparation',priority:'High',done:false}];let route='home';const app=document.getElementById('app');const day=new Date();document.getElementById('today').textContent=day.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function card(n,l){return `<div class="card metric"><div class="num">${n}</div><div class="lbl">${l}</div></div>`}function setHeading(t){document.getElementById('heading').textContent=t}function render(){if(route==='home')home();if(route==='cases')caseList();if(route==='hearings')hearingList();if(route==='tasks')taskList();if(route==='clients')clientList();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.nav===route))}function home(){setHeading('Good morning');const today='2026-09-17',tom='2026-09-18',td=cases.filter(c=>c.next===today&&c.status==='Active'),tm=cases.filter(c=>c.next===tom&&c.status==='Active');app.innerHTML=`<div class="hero"><strong>Today’s work</strong><p>You have <b>${td.length+tasks.filter(t=>!t.done).length}</b> things that need attention.</p></div><div class="grid">${card(td.length,'Hearings today')}${card(tm.length,'Hearings tomorrow')}${card(1,'Updates pending')}${card(cases.filter(c=>c.docs>0&&c.status==='Active').length,'Documents pending')}</div><div class="section">Case diary</div><div class="list">${cases.filter(c=>c.status==='Active').map(c=>`<div class="item"><div class="title">${esc(c.client)}</div><div class="meta">Case No: <b>${esc(c.caseNo)}</b> · Court: ${esc(c.court)}</div><div class="meta">Party: ${esc(c.party||c.client)} · Stage: ${esc(c.stage||c.type)}</div><div class="meta">Previous date: ${esc(c.previous||'—')} · Next date: <b>${esc(c.next||'—')}</b></div><div class="actions"><button class="btn light" onclick="openCase('${c.id}')">Open case</button></div></div>`).join('')}</div><div class="section">Today’s hearings</div><div class="list">${td.length?td.map(h=>`<div class="item"><div class="row"><div style="flex:1"><div class="title">${esc(h.client)}</div><div class="meta">${esc(h.caseNo)} · ${esc(h.court)}</div></div><span class="pill warn">${h.time}</span></div><div class="actions"><button class="btn" onclick="openCase('${h.id}')">Open case</button><button class="btn light" onclick="result('${h.id}')">Update result</button></div></div>`).join(''):`<div class="empty">No hearings today</div>`}</div><div class="section">Quick actions</div><div class="quick"><button class="btn" onclick="newCase()">＋ New case</button><button class="btn light" onclick="addHearing()">＋ Add hearing</button><button class="btn light" onclick="findClient()">⌕ Find client</button><button class="btn light" onclick="requestDoc()">▤ Request document</button><button class="btn ghost" onclick="route='cases';render()">▣ All cases</button><button class="btn ghost" onclick="route='tasks';render()">✓ Tasks</button></div><div class="section">Attention needed</div><div class="list"><div class="item"><span class="pill warn">ACTION</span><div class="title" style="margin-top:7px">Rajesh Sharma — hearing result pending</div><div class="meta">Enter result and next date, then confirm before sending to client.</div><div class="actions"><button class="btn" onclick="result('C-001')">Update result</button></div></div><div class="item"><span class="pill danger">PENDING</span><div class="title" style="margin-top:7px">Amit Singh — 2 documents pending</div><div class="actions"><button class="btn light" onclick="requestDoc()">Request documents</button></div></div></div>`}function caseList(){setHeading('Cases');app.innerHTML=`<input class="search" placeholder="Search client, case number or court" oninput="filterCases(this.value)"><div id="caseRows" class="list" style="margin-top:12px"></div>`;filterCases('')}function filterCases(q){const x=cases.filter(c=>[c.client,c.caseNo,c.court,c.id].join(' ').toLowerCase().includes(q.toLowerCase()));document.getElementById('caseRows').innerHTML=x.map(c=>`<div class="item"><div class="row"><div style="flex:1"><div class="title">${esc(c.client)}</div><div class="meta">${esc(c.caseNo)} · ${esc(c.court)} · ${esc(c.type)}</div></div><span class="pill ${c.status==='Closed'?'ok':'warn'}">${c.status}</span></div>${c.status==='Active'&&c.next?`<div class="meta" style="margin-top:10px">Next hearing: <b>${c.next}</b> · ${c.time}</div>`:''}<div class="actions"><button class="btn" onclick="openCase('${c.id}')">Open</button>${c.status==='Active'?`<button class="btn ghost" onclick="closeCase('${c.id}')">Close</button>`:`<button class="btn light" onclick="reopen('${c.id}')">Reopen</button>`}</div></div>`).join('')||'<div class="empty">No cases found</div>'}function hearingList(){setHeading('Hearings');const upcoming=cases.filter(c=>c.status==='Active'&&c.next).sort((a,b)=>a.next.localeCompare(b.next));app.innerHTML=`<div class="section" style="margin-top:0">Upcoming hearings</div><div class="list">${upcoming.map(c=>`<div class="item"><div class="row"><div style="flex:1"><div class="title">${esc(c.client)}</div><div class="meta">${esc(c.caseNo)} · ${esc(c.court)}</div></div><span class="pill">${c.next}</span></div><div class="meta">${c.time} · ${c.purpose}</div><div class="actions"><button class="btn light" onclick="result('${c.id}')">Update result</button><button class="btn ghost" onclick="openCase('${c.id}')">Open</button></div></div>`).join('')}</div>`}function taskList(){setHeading('Tasks');app.innerHTML=`<div class="quick"><button class="btn" onclick="addTask()">＋ New task</button><button class="btn light" onclick="route='home';render()">⌂ Today</button></div><div class="section">Open tasks</div><div class="list">${tasks.map(t=>`<div class="item"><div class="row"><div style="flex:1"><div class="title">${esc(t.title)}</div><div class="meta">${esc(t.meta)}</div></div><span class="pill ${t.priority==='High'?'danger':''}">${t.priority}</span></div><div class="actions"><button class="btn light" onclick="doneTask(${t.id})">${t.done?'Completed':'Mark done'}</button></div></div>`).join('')}</div>`}function clientList(){setHeading('Clients');app.innerHTML=`<input class="search" placeholder="Search client name or phone" oninput="filterClients(this.value)"><div id="clientRows" class="list" style="margin-top:12px"></div>`;filterClients('')}function filterClients(q){const x=cases.filter(c=>c.client.toLowerCase().includes(q.toLowerCase()));document.getElementById('clientRows').innerHTML=x.map(c=>`<div class="item"><div class="title">${esc(c.client)}</div><div class="meta">Case ${esc(c.caseNo)} · ${esc(c.court)}</div><div class="actions"><button class="btn" onclick="openCase('${c.id}')">Open case</button><button class="btn light" onclick="requestDoc()">Request document</button></div></div>`).join('')||'<div class="empty">No clients found</div>'}function openCase(id){const c=cases.find(x=>x.id===id);setHeading(c.client);app.innerHTML=`<button class="back" onclick="route='cases';render()">← Back to cases</button><div class="card"><span class="pill ${c.status==='Closed'?'ok':'warn'}">${c.status}</span><h2>${esc(c.client)}</h2><div class="meta">${esc(c.caseNo)} · ${esc(c.court)} · ${esc(c.type)}</div>${c.next?`<div class="section">Next hearing</div><div class="item"><b>${c.next}</b> · ${c.time}<div class="meta">${esc(c.purpose)}</div></div>`:''}<div class="section">Documents</div><div class="item">${c.docs?`${c.docs} document(s) pending from client`:'No documents pending'}</div><div class="actions"><button class="btn" onclick="result('${c.id}')">Update hearing result</button><button class="btn light" onclick="addHearing('${c.id}')">Change hearing date</button></div></div>`}function result(id){const c=cases.find(x=>x.id===id);setHeading('Hearing result');app.innerHTML=`<button class="back" onclick="openCase('${id}')">← Back to case</button><div class="card"><div class="title">${esc(c.client)} · ${esc(c.caseNo)}</div><div class="meta">Enter only what the advocate has confirmed.</div><div class="form" style="margin-top:16px"><label>Hearing result</label><textarea id="res" placeholder="Enter hearing result"></textarea><label>Next hearing date</label><input id="next" type="date"><label>Next hearing time</label><input id="ntime" type="time"><button class="btn full" onclick="confirmResult('${id}')">Confirm & Send to Client</button><button class="btn ghost full" onclick="openCase('${id}')">Save for later</button></div></div>`}function confirmResult(id){const c=cases.find(x=>x.id===id);const r=document.getElementById('res').value.trim(),n=document.getElementById('next').value;if(!r){alert('Please enter the hearing result first.');return}if(!n){alert('Please enter the next hearing date.');return}c.next=n;c.time=document.getElementById('ntime').value||'To be confirmed';alert('Confirmed. The result is ready to be sent through the connected client channel.');openCase(id)}function closeCase(id){const c=cases.find(x=>x.id===id);if(confirm(`Close ${c.client}'s case?`)){c.status='Closed';c.next='';render()}}function reopen(id){const c=cases.find(x=>x.id===id);if(confirm(`Reopen ${c.client}'s case?`)){c.status='Active';render()}}function doneTask(id){const t=tasks.find(x=>x.id===id);t.done=!t.done;render()}function newCase(){setHeading('New case');app.innerHTML=`<button class="back" onclick="route='home';render()">← Back</button><div class="card"><div class="form"><label>Client name</label><input id="nc" placeholder="Client name"><label>Case number</label><input id="nno" placeholder="Case number"><label>Court</label><input id="nct" placeholder="Court"><label>Case type</label><input id="nty" placeholder="Civil / Criminal / Family..."><button class="btn full" onclick="alert('New case form saved locally for this demo. Live Sheets sync will be added in the production backend.')">Save case</button></div></div>`}function addHearing(id){setHeading('Add hearing');app.innerHTML=`<button class="back" onclick="${id?`openCase('${id}')`:`route='home';render()`}">← Back</button><div class="card"><div class="form"><label>Hearing date</label><input type="date"><label>Time</label><input type="time"><label>Purpose</label><input placeholder="Purpose"><button class="btn full" onclick="alert('Hearing saved locally for this demo. Automation will use the connected backend in production.')">Save hearing</button></div></div>`}function requestDoc(){alert('Document request screen opened. In production this will send through the selected WhatsApp/SMS channel and log the communication.')}function findClient(){route='clients';render();setTimeout(()=>document.querySelector('.search')?.focus(),50)}function addTask(){alert('Task form opened.')}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{route=b.dataset.nav;render()});render();</script></body></html>
